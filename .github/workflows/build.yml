name: Build Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Read Version
        id: version
        shell: python
        run: |
          import re, os
          m = re.search(r'version\s*=\s*"(.+?)"', open('pyproject.toml').read())
          ver = m.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={ver}\n')

      - name: Sync version.py
        run: echo '__version__ = "${{ steps.version.outputs.version }}"' > src/version.py

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pyinstaller
          uv run playwright install chromium

      - name: Download Language Models
        run: uv run python scripts/download_models.py

      - name: Build (onedir)
        run: uv run pyinstaller FlowState.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Update Installer Version
        shell: powershell
        run: |
          $iss = Get-Content build_scripts\windows_setup.iss
          $iss = $iss -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ steps.version.outputs.version }}"'
          Set-Content build_scripts\windows_setup.iss $iss

      - name: Create Installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' build_scripts\windows_setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowState-Windows-Installer
          path: dist/FlowState_Windows_Setup.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Read Version
        id: version
        shell: python
        run: |
          import re, os
          m = re.search(r'version\s*=\s*"(.+?)"', open('pyproject.toml').read())
          ver = m.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={ver}\n')

      - name: Sync version.py
        run: echo '__version__ = "${{ steps.version.outputs.version }}"' > src/version.py

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pyinstaller
          uv run playwright install chromium

      - name: Download Language Models
        run: uv run python scripts/download_models.py

      - name: Build .app
        run: uv run pyinstaller FlowState_mac.spec --clean --noconfirm

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "FlowState" \
            --volicon "assets/logo.icns" \
            --background "assets/installer/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 80 \
            --icon "FlowState.app" 180 200 \
            --app-drop-link 480 200 \
            --hide-extension "FlowState.app" \
            --no-internet-enable \
            "dist/FlowState_Mac_Installer.dmg" \
            "dist/FlowState.app" || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowState-Mac-Installer
          path: dist/FlowState_Mac_Installer.dmg

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            FlowState-Windows-Installer/FlowState_Windows_Setup.exe
            FlowState-Mac-Installer/FlowState_Mac_Installer.dmg
